<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi Reproductor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
:root{--bg:#f4f4f7;--card:#fff;--tx:#14141a;--mut:#6b6b78;--ac:#7c5cff;--ac2:#ff5c9a;--line:#e4e4ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d12;--card:#17171f;--tx:#f3f3f7;--mut:#8d8d9b;--line:#262631;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d12;--card:#17171f;--tx:#f3f3f7;--mut:#8d8d9b;--line:#262631;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{max-width:520px;margin:0 auto;padding:12px 18px 40px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{width:100%;height:100%;fill:currentColor;display:block}
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
.top h1{font-size:20px;margin:0;letter-spacing:-.3px}
.add{background:var(--ac);color:#fff;border-radius:20px;padding:9px 16px;font-weight:600;font-size:14px}
.card{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.12)}
.art{width:min(100%,300px);aspect-ratio:1;margin:0 auto 20px;border-radius:22px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:72px;color:rgba(255,255,255,.85);box-shadow:0 14px 34px rgba(0,0,0,.28);transition:transform .3s}
.art.on{transform:scale(1)}.art.off{transform:scale(.92)}
.t{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--mut);font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:20px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:10px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(to right,var(--ac) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--tx);margin-top:-6.5px}
.tm{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ctl button{width:44px;height:44px;padding:10px;border-radius:50%;color:var(--tx)}
.ctl .sm{width:38px;height:38px;padding:9px;color:var(--mut)}
.ctl .sm.act{color:var(--ac)}
.ctl .play{width:68px;height:68px;padding:18px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 22px rgba(124,92,255,.45)}
.sec{margin:26px 4px 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center}
.sec button{color:var(--ac);text-transform:none;letter-spacing:0;font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:9px 6px;border-bottom:1px solid var(--line)}
.row .th{width:46px;height:46px;border-radius:10px;flex:none;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.row .in{flex:1;min-width:0;text-align:left}
.row .n{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .n{color:var(--ac)}
.row .x{width:30px;height:30px;color:var(--mut);font-size:20px;line-height:1}
.empty{text-align:center;color:var(--mut);padding:34px 10px;font-size:14px;line-height:1.5}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<div class="top"><h1>♪ Mi Reproductor</h1><button class="add" id="addBtn">+ Añadir música</button></div>
<input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.aiff,.alac,.caf" multiple hidden>

<div class="card">
  <div class="art off" id="art">♪</div>
  <div class="t" id="title">Sin canción</div>
  <div class="a" id="artist">Añade música para empezar</div>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="tm"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
    <button class="sm" id="shuf" aria-label="Aleatorio"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3.2 4.5L14.4 17H17v-3l4 4-4 4v-3h-3.6l-3.9-5.4L5.6 17H3v-2h1.6l3.9-5.4L4.6 5H3V3h2.6l3.9 5.4L13.4 5H17V3z" transform="scale(.9) translate(1,1)"/></svg></button>
    <button id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12L18 18V6z"/></svg></button>
    <button class="play" id="pp" aria-label="Reproducir"><svg viewBox="0 0 24 24" id="ppi"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <button class="sm" id="rep" aria-label="Repetir"><svg viewBox="0 0 24 24" id="repi"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
  </div>
  <div class="ctl" style="justify-content:center;gap:34px;margin-top:4px">
    <button class="sm" id="b10" aria-label="Retroceder 10 segundos" style="font-size:13px;font-weight:700">−10s</button>
    <button class="sm" id="f10" aria-label="Adelantar 10 segundos" style="font-size:13px;font-weight:700">+10s</button>
  </div>
</div>

<div class="sec"><span id="count">Biblioteca</span><button id="clear">Vaciar</button></div>
<div id="list"></div>
<p class="note">Tu música se guarda en este navegador y no se sube a ningún servidor.<br>Para tenerla como app: Compartir → «Añadir a pantalla de inicio».</p>

<audio id="au" preload="auto" playsinline></audio>

<script>
const $=id=>document.getElementById(id),au=$('au');
let tracks=[],cur=-1,shuffle=false,repeat=0,drag=false,url=null,db=null;
const ICON={play:'<path d="M8 5v14l11-7z"/>',pause:'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'};
const fmt=s=>{if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const grad=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return`linear-gradient(135deg,hsl(${h},70%,55%),hsl(${(h+50)%360},75%,45%))`};
const bg=t=>t.art?`url("${t.art}")`:grad(t.title);

/* --- Almacenamiento local (IndexedDB) --- */
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('reproductor',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{keyPath:'id',autoIncrement:true});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
const dbPut=(rec)=>new Promise(r=>{if(!db)return r();try{const q=db.transaction('f','readwrite').objectStore('f').add(rec);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
const dbDel=id=>{try{db&&db.transaction('f','readwrite').objectStore('f').delete(id)}catch(e){}};
const dbClear=()=>{try{db&&db.transaction('f','readwrite').objectStore('f').clear()}catch(e){}};
const dbAll=()=>new Promise(r=>{if(!db)return r([]);try{const q=db.transaction('f').objectStore('f').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}catch(e){r([])}});

/* --- Biblioteca --- */
function readTags(t){
  if(!window.jsmediatags)return;
  try{jsmediatags.read(t.file,{onSuccess:({tags})=>{
    if(tags.title)t.title=tags.title; if(tags.artist)t.artist=tags.artist;
    if(tags.picture){t.art=URL.createObjectURL(new Blob([new Uint8Array(tags.picture.data)],{type:tags.picture.format||'image/jpeg'}))}
    render(); if(tracks[cur]===t)ui();
  },onError:()=>{}})}catch(e){}
}
function addTrack(file,id){
  const t={id,file,title:file.name.replace(/\.[^.]+$/,''),artist:'Artista desconocido',art:null};
  tracks.push(t);readTags(t);return t;
}
async function addFiles(list){
  for(const f of list){
    if(f.type&&!f.type.startsWith('audio')&&!/\.(mp3|m4a|aac|wav|flac|aiff?|alac|caf|mp4)$/i.test(f.name))continue;
    const id=await dbPut({file:f});addTrack(f,id);
  }
  render();if(cur<0&&tracks.length)play(0,false);
}
function render(){
  $('count').textContent=tracks.length?`Biblioteca · ${tracks.length} canciones`:'Biblioteca';
  $('clear').style.display=tracks.length?'':'none';
  const L=$('list');L.innerHTML='';
  if(!tracks.length){L.innerHTML='<div class="empty">Toca «Añadir música» y selecciona tus archivos<br>(app Archivos o tu iPhone).</div>';return}
  tracks.forEach((t,i)=>{
    const r=document.createElement('div');r.className='row'+(i===cur?' cur':'');
    r.innerHTML='<div class="th"></div><button class="in"><div class="n"></div><div class="s"></div></button><button class="x" aria-label="Quitar">×</button>';
    const th=r.querySelector('.th');th.style.backgroundImage=bg(t);if(!t.art)th.textContent='♪';
    r.querySelector('.n').textContent=t.title;r.querySelector('.s').textContent=t.artist;
    r.querySelector('.in').onclick=()=>play(i,true);
    r.querySelector('.x').onclick=()=>remove(i);
    L.appendChild(r);
  });
}
function remove(i){
  const t=tracks[i];dbDel(t.id);
  if(i===cur){au.pause();au.removeAttribute('src');cur=-1;tracks.splice(i,1);if(tracks.length)play(Math.min(i,tracks.length-1),false);else ui()}
  else{tracks.splice(i,1);if(i<cur)cur--}
  render();
}

/* --- Reproducción --- */
function play(i,go=true){
  if(i<0||i>=tracks.length)return;
  cur=i;const t=tracks[i];
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(t.file);au.src=url;
  ui();render();
  if(go)au.play().catch(()=>{});
}
function nextIdx(){
  if(!tracks.length)return -1;
  if(shuffle&&tracks.length>1){let n;do{n=Math.floor(Math.random()*tracks.length)}while(n===cur);return n}
  return cur+1<tracks.length?cur+1:0;
}
function next(auto){
  const n=nextIdx();if(n<0)return;
  if(auto&&repeat===0&&!shuffle&&cur===tracks.length-1){au.pause();play(0,false);return}
  play(n,true);
}
function prev(){
  if(au.currentTime>3){au.currentTime=0;return}
  if(!tracks.length)return;
  play(cur>0?cur-1:tracks.length-1,true);
}
const toggle=()=>{if(!tracks.length)return;au.paused?au.play().catch(()=>{}):au.pause()};
const skip=d=>{au.currentTime=Math.max(0,Math.min(au.duration||0,au.currentTime+d))};

function ui(){
  const t=tracks[cur];
  $('title').textContent=t?t.title:'Sin canción';
  $('artist').textContent=t?t.artist:'Añade música para empezar';
  const a=$('art');a.style.backgroundImage=t?bg(t):'';a.textContent=t&&t.art?'':'♪';
  if(!t)a.style.backgroundImage='linear-gradient(135deg,#7c5cff,#ff5c9a)';
  if(t&&'mediaSession'in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:'Mi Reproductor',artwork:t.art?[{src:t.art,sizes:'512x512',type:'image/jpeg'}]:[]});
  }
}
function state(){
  const p=!au.paused;
  $('ppi').innerHTML=p?ICON.pause:ICON.play;
  $('art').className='art '+(p?'on':'off');
  if('mediaSession'in navigator)navigator.mediaSession.playbackState=p?'playing':'paused';
}
let lastPos=0;
function pos(){
  const d=au.duration;
  if(!isFinite(d))return;
  if(!drag){$('seek').value=d?au.currentTime/d*1000:0;$('seek').style.setProperty('--p',(au.currentTime/d*100)+'%')}
  $('cur').textContent=fmt(au.currentTime);$('dur').textContent=fmt(d);
  const now=Date.now();
  if('mediaSession'in navigator&&now-lastPos>1000){lastPos=now;try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(au.currentTime,d),playbackRate:au.playbackRate||1})}catch(e){}}
}
au.addEventListener('play',state);au.addEventListener('pause',state);
au.addEventListener('timeupdate',pos);au.addEventListener('loadedmetadata',pos);
au.addEventListener('ended',()=>{if(repeat===2){au.currentTime=0;au.play()}else next(repeat===0)});
au.addEventListener('error',()=>{if(tracks[cur]){$('artist').textContent='Formato no compatible con iPhone';}});

/* --- Controles --- */
$('addBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
$('pp').onclick=toggle;$('next').onclick=()=>next(false);$('prev').onclick=prev;
$('b10').onclick=()=>skip(-10);$('f10').onclick=()=>skip(10);
$('shuf').onclick=()=>{shuffle=!shuffle;$('shuf').classList.toggle('act',shuffle)};
$('rep').onclick=()=>{repeat=(repeat+1)%3;$('rep').classList.toggle('act',repeat>0);
  $('repi').innerHTML=repeat===2?'<path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/><text x="12" y="15.5" font-size="8" font-weight="700" text-anchor="middle" fill="currentColor" stroke="var(--card)" stroke-width="2" paint-order="stroke">1</text>':'<path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/>'};
$('clear').onclick=()=>{if(!confirm('¿Vaciar toda la biblioteca?'))return;au.pause();au.removeAttribute('src');tracks=[];cur=-1;dbClear();ui();render();state()};
const sk=$('seek');
sk.addEventListener('input',()=>{drag=true;const d=au.duration||0;$('cur').textContent=fmt(sk.value/1000*d);sk.style.setProperty('--p',sk.value/10+'%')});
sk.addEventListener('change',()=>{au.currentTime=sk.value/1000*(au.duration||0);drag=false});

/* --- Pantalla de bloqueo / Centro de control --- */
if('mediaSession'in navigator){
  const ms=navigator.mediaSession,set=(a,f)=>{try{ms.setActionHandler(a,f)}catch(e){}};
  set('play',()=>au.play());set('pause',()=>au.pause());
  set('previoustrack',prev);set('nexttrack',()=>next(false));
  set('seekbackward',d=>skip(-(d&&d.seekOffset||10)));
  set('seekforward',d=>skip(d&&d.seekOffset||10));
  set('seekto',d=>{if(d.fastSeek&&'fastSeek'in au)au.fastSeek(d.seekTime);else au.currentTime=d.seekTime});
}

/* --- Inicio --- */
(async()=>{
  await openDB();
  const recs=await dbAll();
  recs.forEach(r=>addTrack(r.file,r.id));
  render();
  if(tracks.length){cur=0;const t=tracks[0];url=URL.createObjectURL(t.file);au.src=url;ui();render()}
  ui();
})();
</script>
</body>
</html>
